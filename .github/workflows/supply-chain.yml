name: Supply chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: python, queries: security-and-quality}
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: {fail-on-severity: high}

  image-and-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          tags: workpilot:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: workpilot:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: anchore/sbom-action@v0
        with:
          image: workpilot:${{ github.sha }}
          format: spdx-json
          output-file: workpilot.spdx.json
      - uses: actions/attest-sbom@v2
        if: github.event_name == 'push'
        with:
          subject-name: workpilot
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: workpilot.spdx.json

  deploy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/workpilot
      - run: >-
          helm template workpilot deploy/helm/workpilot
          --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set autoscaling.enabled=true > /tmp/workpilot-manifest.yaml
