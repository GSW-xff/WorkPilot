[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workpilot"
version = "0.2.0"
description = "A safe, auditable MVP runtime for cross-system office tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
workpilot = "workpilot.__main__:main"
workpilot-worker = "workpilot.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["workpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
omit = [
  "workpilot/__main__.py",
  "workpilot/worker.py",
]
