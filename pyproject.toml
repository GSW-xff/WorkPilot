[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workpilot"
version = "0.2.0"
description = "A safe, auditable MVP runtime for cross-system office tasks"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "WorkPilot contributors" }]
keywords = ["agent", "automation", "fastapi", "temporal", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1.5,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "playwright>=1.55,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
workpilot = "workpilot.__main__:main"
workpilot-eval = "workpilot.evaluation:main"
workpilot-model-eval = "workpilot.model_evaluation:main"
workpilot-github-sandbox = "workpilot.github_sandbox:main"
workpilot-retrieval-eval = "workpilot.retrieval_evaluation:main"
workpilot-security-eval = "workpilot.security_evaluation:main"
workpilot-benchmark = "benchmarks.api_load:main"
workpilot-worker = "workpilot.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["workpilot", "apps", "benchmarks", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
omit = [
  "workpilot/__main__.py",
  "workpilot/worker.py",
]
