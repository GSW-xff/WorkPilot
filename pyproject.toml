[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workpilot"
version = "0.1.0"
description = "A safe, auditable MVP runtime for cross-system office tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
workpilot = "workpilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["workpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

