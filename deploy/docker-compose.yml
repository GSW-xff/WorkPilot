services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - workpilot-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-workpilot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WORKPILOT_HOST: 0.0.0.0
      WORKPILOT_PORT: 8000
      WORKPILOT_DATABASE_URL: postgresql+psycopg://workpilot_app:workpilot_app@postgres:5432/workpilot
      WORKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://workpilot_owner:workpilot_owner@postgres:5432/workpilot
      WORKPILOT_ALLOWED_RECIPIENT_DOMAINS: example.com
      WORKPILOT_TEMPORAL_TARGET: temporal:7233
      WORKPILOT_TEMPORAL_TASK_QUEUE: workpilot-tasks
    command:
      - /bin/sh
      - -c
      - >-
        WORKPILOT_DATABASE_URL=$$WORKPILOT_MIGRATION_DATABASE_URL alembic upgrade head
        && python -m workpilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WORKPILOT_DATABASE_URL: postgresql+psycopg://workpilot_app:workpilot_app@postgres:5432/workpilot
      WORKPILOT_TEMPORAL_TARGET: temporal:7233
      WORKPILOT_TEMPORAL_TASK_QUEUE: workpilot-tasks
      WORKPILOT_ALLOWED_RECIPIENT_DOMAINS: example.com
    command: ["python", "-m", "workpilot.worker"]
    depends_on:
      api:
        condition: service_started
      temporal:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  workpilot-postgres:
