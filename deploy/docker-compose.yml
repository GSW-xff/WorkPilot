services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - workpilot-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-workpilot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WORKPILOT_HOST: 0.0.0.0
      WORKPILOT_PORT: 8000
      WORKPILOT_DATABASE_URL: postgresql+psycopg://workpilot_app:workpilot_app@postgres:5432/workpilot
      WORKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://workpilot_owner:workpilot_owner@postgres:5432/workpilot
      WORKPILOT_ALLOWED_RECIPIENT_DOMAINS: example.com
      WORKPILOT_TEMPORAL_TARGET: temporal:7233
      WORKPILOT_TEMPORAL_TASK_QUEUE: workpilot-tasks
      WORKPILOT_OTLP_ENDPOINT: http://otel-collector:4317
      WORKPILOT_SERVICE_NAME: workpilot-api
    command:
      - /bin/sh
      - -c
      - >-
        WORKPILOT_DATABASE_URL=$$WORKPILOT_MIGRATION_DATABASE_URL alembic upgrade head
        && python -m workpilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WORKPILOT_DATABASE_URL: postgresql+psycopg://workpilot_app:workpilot_app@postgres:5432/workpilot
      WORKPILOT_TEMPORAL_TARGET: temporal:7233
      WORKPILOT_TEMPORAL_TASK_QUEUE: workpilot-tasks
      WORKPILOT_ALLOWED_RECIPIENT_DOMAINS: example.com
      WORKPILOT_OTLP_ENDPOINT: http://otel-collector:4317
      WORKPILOT_SERVICE_NAME: workpilot-worker
    command: ["python", "-m", "workpilot.worker"]
    depends_on:
      api:
        condition: service_started
      temporal:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - workpilot-tempo:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: workpilot
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/workpilot-dashboard.json:/var/lib/grafana/dashboards/workpilot.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  workpilot-postgres:
  workpilot-tempo:
